[project]
name = "argos-ops"
version = "0.1.0"
description = "Flotte d'agents IA pilotée par Claude Code pour acquisition, conversion, support et admin de Argos / SecHunter / Omnividens"
requires-python = ">=3.12"
authors = [{ name = "Omnividens" }]
license = { text = "Proprietary" }
dependencies = [
  # Core
  "httpx[http2]>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "loguru>=0.7",

  # CRM / DB
  "sqlmodel>=0.0.16",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2.5",
  "redis>=5.0",
  "alembic>=1.13",

  # Web (chat widget + ops dashboard)
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sse-starlette>=2.1",

  # LLM (Gemini for chat live, embeddings) — SDK moderne, remplace google-generativeai déprécié
  "google-genai>=1.0",

  # Google APIs (Gmail)
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "google-api-python-client>=2.125",

  # Reddit
  "praw>=7.7",

  # LinkedIn — pas de SDK officiel stable, on appelle l'API directement via httpx
  # Mastodon (remplace X)
  "Mastodon.py>=1.8",

  # Stripe
  "stripe>=9.5",

  # Auth (TOTP for ops dashboard)
  "pyotp>=2.9",

  # Cron parsing (validation côté backend ops dashboard)
  "croniter>=2.0",

  # Markdown parsing (KB chunking)
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos_ops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # ligne 100 déjà gérée par formatter

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
