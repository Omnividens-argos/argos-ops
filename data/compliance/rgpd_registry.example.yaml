# RGPD — Registre des traitements (exemple).
#
# Renomme en `rgpd_registry.yaml` puis maintiens-le à jour à chaque
# nouvelle collecte de données personnelles. RGPDAuditor (P22.E) croise
# automatiquement ce fichier avec les scans PII sur le code.
#
# Chaque traitement DOIT déclarer :
# - nom : court, parlant à un humain
# - base_legale : intérêt légitime / consentement / contrat / obligation légale / mission service public / sauvegarde intérêts vitaux
# - finalite : pourquoi on collecte
# - paths : liste de chemins (fichiers ou dossiers) qui implémentent la collecte
# - duree_conservation : durée maximale en mois (None = pas de limite documentée)
# - destinataires : qui voit la donnée (interne uniquement / sous-traitants listés)
#
# Le fichier est versionné — toute modif passe par PR + revue.

traitements:
  - nom: "Lead BtoB outbound"
    base_legale: "intérêt légitime"
    finalite: "Prospection BtoB ciblée selon ICP, conforme RGPD considérant 47"
    paths:
      - argos_ops/agents/outbound_bot.py
      - argos_ops/agents/email_bot.py
      - argos_ops/agents/lead_enricher.py        # P22.H : enrichit nom + domaine + email guess
      - argos_ops/agents/prospect_miner.py       # P22.H : sourcing leads via RSS publics
      - argos_ops/agents/intent_signals.py       # P22.H : signaux achat publics (RSS)
    duree_conservation: 36
    destinataires: "interne uniquement"

  - nom: "Sales pipe & deals (P22.H)"
    base_legale: "intérêt légitime + exécution du contrat (en pré-vente)"
    finalite: "Suivi commercial : RDV démo, récap post-démo, devis, contrat, scoring du pipe"
    paths:
      - argos_ops/agents/meeting_booker.py       # email + nom + ICS attendee
      - argos_ops/agents/demo_followup.py        # email + nom + pain points post-démo
      - argos_ops/agents/proposal_bot.py         # contact_name + contact_email + SIRET
      - argos_ops/agents/contract_generator.py   # CGV/MSA — contact_name + contact_email + SIRET
      - argos_ops/agents/deal_risk_scorer.py     # pipe.yaml (company + amount + last_activity)
    duree_conservation: 60  # 5 ans (prescription commerciale FR)
    destinataires: "interne uniquement"

  - nom: "Marketing & Growth — drafting outbound (P22.I)"
    base_legale: "intérêt légitime"
    finalite: "Drafting de contenu sortant marketing (newsletter, backlink outreach, demandes testimonial post-NPS, case studies clients référencés). Tous les drafts sont validés humain-in-the-loop avant envoi."
    paths:
      - argos_ops/agents/newsletter_bot.py         # liste email newsletter (envoi humain)
      - argos_ops/agents/backlink_outreach.py      # contact_email sites cyber FR
      - argos_ops/agents/testimonial_hunter.py     # contact_name + email post-NPS promoteurs
      - argos_ops/agents/case_study_drafter.py    # customer + quote + résultats (avec consentement)
    duree_conservation: 36  # 3 ans (cf. CNIL prospection BtoB)
    destinataires: "interne + LinkedIn/Mastodon APIs (ContentBot, sous-traitants)"

  - nom: "Marketing & Growth — publication / pilotage (P22.I)"
    base_legale: "intérêt légitime (présence en ligne, acquisition)"
    finalite: "Publication automatique de posts sociaux validés + pilotage campagnes ads via APIs tierces"
    paths:
      - argos_ops/agents/content_bot.py            # publish LinkedIn + Mastodon
      - argos_ops/agents/ad_bot_live.py            # Google/LinkedIn/Meta Ads APIs
    duree_conservation: 36
    destinataires: "LinkedIn / Mastodon / Google Ads / Meta Ads / LinkedIn Campaign Manager (sous-traitants)"

  - nom: "Support client Tier 1"
    base_legale: "exécution du contrat"
    finalite: "Répondre aux tickets support clients Argos"
    paths:
      - argos_ops/crm/repository.py
      - argos_ops/agents/email_bot.py
      - argos_ops/agents/support_bot.py          # P22.G : health-check KB pour /run-support-tier1
      - argos_ops/agents/escalation_router.py    # P22.G : triage tickets P0/P1/P2 + customer_id
      - argos_ops/agents/kb_updater.py           # P22.G : drafts KB depuis subjects tickets
    duree_conservation: 60
    destinataires: "interne uniquement"

  - nom: "Customer Success — onboarding & lifecycle (P22.G)"
    base_legale: "exécution du contrat + intérêt légitime (rétention)"
    finalite: "Drafting emails onboarding (J+0/J+7/J+30), demandes NPS post-onboarding/renew, demandes G2/Capterra J+30. Humain-in-the-loop strict — tous les drafts validés avant envoi via zimbra-ops."
    paths:
      - argos_ops/agents/onboarding_bot.py       # contact_name + contact_email + signup_date
      - argos_ops/agents/nps_collector.py        # contact_name + contact_email post-NPS
      - argos_ops/agents/review_bot.py           # contact_name + contact_email pour G2/Capterra
    duree_conservation: 36
    destinataires: "interne uniquement"

  - nom: "Facturation Stripe"
    base_legale: "exécution du contrat + obligation légale comptable"
    finalite: "Émission factures + dunning + comptabilité"
    paths:
      - argos_ops/agents/finance_bot.py
    duree_conservation: 120  # obligation fiscale 10 ans
    destinataires: "Stripe (sous-traitant) + cabinet comptable"

# Bots exemptés (aucune donnée perso traitée) — listés ici pour la traçabilité
# de l'audit interne RGPDAuditor. Ne déclencher AUCUNE alerte sur ces paths.
# À mettre à jour si un de ces bots venait à toucher de la PII.
bots_sans_pii:
  - nom: "Direction & Stratégie (P22.E)"
    motif: "Agrégation de métriques internes (agent_runs, MRR agrégé, OKR KPIs, décisions)"
    paths:
      - argos_ops/agents/strategy_bot.py     # lit agent_runs (nom d'agent, status)
      - argos_ops/agents/okr_tracker.py      # lit data/okr/*.yaml (KPIs cibles)
      - argos_ops/agents/board_reporter.py   # MRR agrégé via sum_active_mrr_eur
      - argos_ops/agents/decision_logger.py  # docs/DECISIONS.md (décisions internes)

  - nom: "Finance & Trésorerie (P22.F) — bots d'agrégation interne"
    motif: "Calculs financiers internes (MRR/ARR agrégé, forecast cash flow, TVA CA3, runway, contrats fournisseurs). Aucune PII identifiable n'est exposée par ces 6 bots. Les emails clients restent confinés à FinanceBot (déjà déclaré sous 'Facturation Stripe')."
    paths:
      - argos_ops/agents/invoice_predictor.py      # forecast 30/60/90j depuis MRR agrégé
      - argos_ops/agents/expense_auditor.py        # CSV Qonto (noms vendors = entreprises)
      - argos_ops/agents/tax_bot.py                # TVA CA3 + IS depuis MRR agrégé
      - argos_ops/agents/reconcile_bot.py          # payouts Stripe ↔ crédits Qonto (montants)
      - argos_ops/agents/burn_rate_monitor.py      # YAML treasury (cash/burn/revenue)
      - argos_ops/agents/vendor_contract_watcher.py  # YAML contrats fournisseurs (B2B)

  - nom: "Marketing & Growth (P22.I) — bots audit-only / agrégation"
    motif: "Lecture sources publiques (RSS, SERP, analytics agrégées internes) + health-check passif. Aucune PII identifiable traitée par ces 6 bots."
    paths:
      - argos_ops/agents/seo_bot.py                # health-check briefs SEO (compte fichiers)
      - argos_ops/agents/trend_spotter.py          # YAML sources cyber publiques
      - argos_ops/agents/social_analytics.py       # engagement agrégé par canal
      - argos_ops/agents/keyword_radar.py          # positions SERP keywords trackés
      - argos_ops/agents/landing_optimizer.py      # métriques landing pages anonymes
      - argos_ops/agents/webinar_promoter.py       # métadonnées webinars publiques

  - nom: "Customer Success & Support (P22.G) — bots audit-only / scoring agrégé"
    motif: "Scoring déterministe interne (churn risk, health bands, usage upsell). Snapshots YAML contiennent customer_id agrégé + scores, jamais envoyés à des tiers — alimentent les décisions humaines de relance."
    paths:
      - argos_ops/agents/churn_predictor.py        # snapshots customer_id × risk_score
      - argos_ops/agents/health_score.py           # snapshots customer_id × health bands
      - argos_ops/agents/upsell_spotter.py         # snapshots customer_id × usage_ratio

  - nom: "Produit & R&D (P22.J) — bots interne / publication produit"
    motif: "Drafting de contenu produit interne (changelog, release notes) ou publication de la roadmap publique épurée. Pas de PII : ChangelogBot/ReleaseNotesBot lisent git log + spec.yaml ; FeedbackAggregator agrège des thèmes (pas de customer_id exposé) ; RoadmapPublisher transforme l'Annexe D interne en page publique ; BugTriageBot lit issues GitHub publiques."
    paths:
      - argos_ops/agents/changelog_bot.py           # git log → changelog markdown
      - argos_ops/agents/release_notes.py           # spec.yaml → release notes markdown
      - argos_ops/agents/feedback_aggregator.py     # YAML feedback agrégé par thème
      - argos_ops/agents/roadmap_publisher.py       # Annexe D interne → roadmap publique
      - argos_ops/agents/bug_triage.py              # issues GitHub publiques → priorities
