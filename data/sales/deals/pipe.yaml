# Pipeline commercial Argos — source de DealRiskScorer + page Pipeline cockpit.
#
# Saisi à la main par le fondateur (read-only côté bots). DealRiskScorer
# score chaque deal et flag les stalled (inactivité > seuil par stade).
#
# Schéma : cf. argos_ops/agents/deal_risk_scorer.py (loader strict du bot).
# stage : discovery | demo_scheduled | demo_done | proposal_sent | contract_sent | won | lost
# (DealRiskScorer exige un stage valide de cet enum — sinon le run échoue.)

deals:
  - deal_id: "DEAL-2026-0001"
    company: "Exemple SA"
    stage: "demo_done"                   # cf. enum DealStage ci-dessus
    amount_eur: 8000                     # MRR annualisé estimé
    last_activity_at: "2026-06-09"       # dernière interaction (sert au scoring stalled)
    owner: "fondateur"
    notes: "RSSI intéressé après la démo, attend un devis pour ~50 scans/mois."
